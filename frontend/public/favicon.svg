<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#60a5fa" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="32" height="32" rx="8" fill="url(#brandGrad)" />

  <!-- Radar / Pulse concentric arcs & sweep -->
  <g fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(4, 4)">
    <!-- Radar center dot -->
    <circle cx="12" cy="12" r="2" fill="#ffffff" stroke="none" />
    
    <!-- Outer wave 1 -->
    <path d="M12 2a10 10 0 0 1 10 10" stroke="#bfdbfe" opacity="0.9" />
    
    <!-- Outer wave 2 -->
    <path d="M12 6a6 6 0 0 1 6 6" stroke="#ffffff" />
    
    <!-- Sweep needle line -->
    <path d="M12 12L19.5 4.5" stroke="#60a5fa" stroke-width="2" filter="url(#glow)" />
  </g>
</svg>
